; Web VMU - M5Stack CoreS3 (+ Faces Bottom3 + Gamepad3)
;
;   pio run -t upload -t monitor   (build + flash the firmware, then show the serial log)
;   pio run -t uploadfs            (only if you put memory cards in data/cards: copies data/ to the device)
;
; The emulator itself is ../core (the same files the website's vmu.wasm is built from);
; src/core_vmu.cpp and src/core_vmufs.cpp pull it in.

[platformio]
default_envs = cores3

[env:cores3]
platform = espressif32@^6.9.0
board = m5stack-cores3
framework = arduino
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
board_build.f_cpu = 240000000L
board_upload.flash_size = 16MB
; the CoreS3's USB shows up as /dev/ttyACM0 (never the laptop's built-in /dev/ttyS0)
upload_port = /dev/ttyACM*
monitor_port = /dev/ttyACM*
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
  -O2
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
build_unflags = -Os
build_src_filter = +<*> -<coretest.cpp>
lib_deps =
  m5stack/M5Unified@^0.2.2

; ---------------------------------------------------------------------------------------------
; Self-test of the emulator core on the chip (serial output only; works on any ESP32-S3 board):
;   pio run -e coretest -t upload -t monitor
; It checks the core against results from the PC build and prints how much processor time it needs.
[env:coretest]
platform = espressif32@^6.9.0
board = m5stack-cores3
framework = arduino
board_build.f_cpu = 240000000L
upload_port = /dev/ttyACM*
monitor_port = /dev/ttyACM*
monitor_speed = 115200
build_flags =
  -O2
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
build_unflags = -Os
build_src_filter = +<*> -<main.cpp>
